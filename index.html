<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokedex API</title>
    <link rel="shortcut icon" href="./assets/logoPokedex.png" type="image/x-icon" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="stylesheet" href="./assets/css/grid-layout.css" />
    <link href="./output.css" rel="stylesheet" />
  </head>
  <body>
    <header class="font-ManropeBlack">
      <div class="logo text-3xl"><h2>Pokedex</h2></div>
      <div class="sections flex gap-4">
        <ul class="flex gap-4">
          <li class="text-[#ef4035]">Explorar</li>
          <li class="text-[#0000008C]">Favoritos</li>
        </ul>
        <div class="filtro">
          <p>&#10084;&#65039;&#65039; <span>0</span></p>
        </div>
      </div>
    </header>

    <main>
      <div class="search hero-grid">
        <!-- pokebola no fundo  -->
        <div class="pokeball-decoration" aria-hidden="true">
          <span class="pokeball-mark"></span>
        </div>

        <div class="search-text">
          <span class="font-ManropeBlack text-[#ef4035]">&#128165; Explore o mundo Pokémon </span>

          <h1 class="font-spaceBlack text-8xl">
            Descubra.
            <span class="text-[#ef4035]">Colecione.</span>
          </h1>

          <p class="font-ManropeWhite text-2xl text-[#0000008C] leading-6">
            Encontre informações, habilidades e estatísticas de cada Pokémon em um só lugar.
          </p>

          <form class="search-inputs gap-3">
            <label for="searchPokemon" class="search-field bg-white rounded-2xl px-5 py-4">
              🔎
              <input class="font-ManropeWhite" type="text" id="searchPokemon" placeholder="Busque por nome ou número..." />
            </label>

            <button type="submit" id="teste" class="search-button bg-black font-ManropeWhite rounded-lg px-8 py-4">
              Buscar <span aria-hidden="true">→</span>
            </button>
          </form>
        </div>
      </div>

      <div class="containerPokedex border-2 border-amber-50" id="containerPokedex">
        <!-- titulo e filtros main  -->
        <div class="catalago-header">
          <p class="font-ManropeBlack text-sm uppercase text-[#0000008C]">Catálogo nacional</p>
          <h2 class="font-spaceBlack text-4xl flex justify-between items-center">
            Conheça os Pokémon <span class="font-ManropeWhite text-sm uppercase text-[#0000008C]">&#128190; 18 resultados</span>
          </h2>
          <div>
            <p class="bg-black font-ManropeWhite rounded-2xl flex justify-center items-center w-16 h-8 text-white">todos</p>
          </div>
        </div>

        <!-- catalago pokemons  -->
        <div class="catalago-pokemons">
          <div id="containerCard"></div>
          <!-- dados via api (tipos de pokemon)  -->
        </div>
      </div>
    </main>

    <footer>
      <span>Dados fornecidos pela PokéAPI</span>
      <span>Projeto para fins de estudo</span>
    </footer>
    <script src="./assets/modules/script.js"></script>
  </body>
</html>
